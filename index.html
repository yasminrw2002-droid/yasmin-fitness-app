<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Yasmin Fitness App V3</title><link rel='stylesheet' href='styles.css'></head><body><aside class='sidebar'><h2>💪 Yasmin Fitness</h2><button onclick="show('dashboard')">Dashboard</button><button onclick="show('workout')">Today's Workout</button><button onclick="show('meals')">Meal Plan</button><button onclick="show('planner')">Shift Planner</button><button onclick="show('progress')">Progress</button></aside><main><section id='dashboard' class='page active'><h1>Dashboard</h1><div class='grid'><div class='card'><h3>Calories</h3><p>2200</p></div><div class='card'><h3>Protein</h3><p>130g</p></div><div class='card'><h3>Steps</h3><p>7k-9k</p></div><div class='card'><h3>Sleep</h3><p>7-9h</p></div></div><div class='card'><h3>Rotation</h3><p>Lower A → Upper A → Lower B → Upper B</p></div></section><section id='workout' class='page'><h1>Today's Workout</h1><div id='workoutBox' class='card'></div></section><section id='meals' class='page'><h1>Meal Plan</h1><div class='card'><ul><li>Overnight Oats</li><li>Skyr + Banana</li><li>Chicken & Rice</li><li>Eggs & Almonds</li><li>Salmon & Potatoes</li></ul></div></section><section id='planner' class='page'><h1>14 Day Shift Planner</h1><div id='plannerBox'></div></section><section id='progress' class='page'><h1>Progress</h1><div class='card'><input id='weight' placeholder='Weight kg'><button onclick='saveWeight()'>Save</button><p id='weights'></p></div></section></main><script src='app.js'></script></body></html>
