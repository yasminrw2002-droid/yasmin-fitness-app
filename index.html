<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Yasmin Fitness App</title><link rel='stylesheet' href='styles.css'></head><body><div class='sidebar'><h2>💪 Yasmin App</h2><button onclick="showPage('home')">Home</button><button onclick="showPage('workout')">Today's Workout</button><button onclick="showPage('meals')">Today's Meal Plan</button><button onclick="showPage('planner')">14 Day Planner</button><button onclick="showPage('checkin')">Daily Check-In</button><button onclick="showPage('progress')">Progress</button></div><main class='content'><section id='home' class='page active'><h1>Welcome Yasmin</h1><div class='cards'><div class='card'><h3>Calories</h3><p>2200 kcal</p></div><div class='card'><h3>Protein</h3><p>130g</p></div><div class='card'><h3>Steps</h3><p>7000-9000</p></div><div class='card'><h3>Sleep</h3><p>7-9 hrs</p></div></div><div class='card'><h3>Rotation</h3><p>Lower A → Upper A → Lower B → Upper B</p></div></section><section id='workout' class='page'><h1>Today's Workout</h1><div id='workoutContent'></div></section><section id='meals' class='page'><h1>Today's Meal Plan</h1><div id='mealContent'></div></section><section id='planner' class='page'><h1>14 Day Planner</h1><div id='plannerContent'></div></section><section id='checkin' class='page'><h1>Daily Check-In</h1><div class='card'><input id='protein' placeholder='Protein g'><input id='calories' placeholder='Calories'><button onclick='saveCheckin()'>Save</button><p id='checkinResult'></p></div></section><section id='progress' class='page'><h1>Progress</h1><div class='card'><p>Weight, waist and cardio tracking can be added here.</p></div></section></main><script src='data.js'></script><script src='app.js'></script></body></html>
